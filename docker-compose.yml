services:
  backend:
    build: ./backend
    environment:
      PORT: 3000
    # No published port, on purpose: locally as in the cloud, the backend is
    # reachable only from the frontend, never from the host.
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    # Host port is overridable: on Windows, Hyper-V reserves port ranges
    # (netsh interface ipv4 show excludedportrange protocol=tcp) and 8080 can
    # be unusable with nothing listening on it. FRONTEND_PORT=9080 works around it.
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    environment:
      BACKEND_URL: http://backend:3000
      BACKEND_HOST: backend
    depends_on:
      - backend
    restart: unless-stopped
