name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: read the code, write packages. Nothing else.
permissions:
  contents: read
  packages: write

# Two quick pushes must not race; the older run is cancelled so the newest
# commit is always the one that ends up published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Report both services independently rather than cancelling the sibling
      # job on the first failure.
      fail-fast: false
      matrix:
        service: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR rejects uppercase image paths, and this repository's owner and
      # name both contain capitals, so the path is lowercased explicitly.
      - name: Compute image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests build but never publish: a fork must not be able to push
      # an image into this registry.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The commit SHA is the immutable, traceable tag that deployment will
      # use. "latest" exists for humans only, and only on the default branch.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per service so the two matrix jobs do not evict each
          # other's layers.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
