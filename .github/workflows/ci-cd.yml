name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: read the code, write packages. Nothing else.
permissions:
  contents: read
  packages: write

# Two quick pushes must not race; the older run is cancelled so the newest
# commit is always the one that ends up published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  RESOURCE_GROUP: rg-sgtest
  FRONTEND_APP: ca-sgtest-frontend
  BACKEND_APP: ca-sgtest-backend

jobs:
  # Tests run before the build: a logic regression must not produce an image,
  # let alone reach the registry. Failing here costs one minute; failing after
  # deployment costs a rollback.
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

  build-and-push:
    needs: test
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Report both services independently rather than cancelling the sibling
      # job on the first failure.
      fail-fast: false
      matrix:
        service: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR rejects uppercase image paths, and this repository's owner and
      # name both contain capitals, so the path is lowercased explicitly.
      - name: Compute image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests build but never publish: a fork must not be able to push
      # an image into this registry.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The commit SHA is the immutable, traceable tag that deployment will
      # use. "latest" exists for humans only, and only on the default branch.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per service so the two matrix jobs do not evict each
          # other's layers.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Deploy is a separate job so it is gated on a green build and can be re-run
  # on its own. Terraform owns the infrastructure; this job only moves the
  # running version forward.
  deploy:
    name: deploy to container apps
    needs: build-and-push
    # Never deploy from a pull request, and only from the default branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Job-level permissions replace the workflow defaults. id-token lets the
    # runner request the short-lived OIDC token that Azure exchanges for
    # access; packages: write is not needed here and is dropped.
    permissions:
      contents: read
      id-token: write

    steps:
      # No stored credential: GitHub proves its identity, Azure issues a token
      # valid for minutes. There is nothing long-lived to leak or to rotate.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image repository
        run: echo "IMAGE_REPO=$REGISTRY/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The commit SHA, never :latest. Container Apps compares the image
      # string: redeploying the same :latest tag creates no revision, so the
      # deployment silently does nothing.
      #
      # Backend first: the frontend proxies to it, so it should be the newer
      # of the two if the two rollouts briefly overlap.
      - name: Deploy backend
        run: az containerapp update -n "$BACKEND_APP" -g "$RESOURCE_GROUP" --image "$IMAGE_REPO/backend:$GITHUB_SHA" --output none

      - name: Deploy frontend
        run: az containerapp update -n "$FRONTEND_APP" -g "$RESOURCE_GROUP" --image "$IMAGE_REPO/frontend:$GITHUB_SHA" --output none

      # A successful update call means "request accepted", not "application
      # works". This asserts the public URL actually serves the API through to
      # the backend before the pipeline is allowed to report green.
      - name: Smoke test public URL
        run: |
          FQDN=$(az containerapp show -n "$FRONTEND_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Testing https://$FQDN"

          for attempt in $(seq 1 10); do
            body=$(curl -fsS --max-time 15 "https://$FQDN/api/health" || true)
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "healthy: $body"
              exit 0
            fi
            echo "attempt $attempt: not ready yet"
            sleep 10
          done

          echo "::error::Deployment did not become healthy in time"
          exit 1
